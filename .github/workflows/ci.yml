name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: Emacs ${{ matrix.emacs_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version:
          - '29.1'   # the floor declared in Package-Requires
          - '29.4'
          - '30.1'
        experimental: [false]
        include:
          - emacs_version: snapshot
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - run: emacs --version
      - name: Compile with warnings as errors, then run the tests
        run: make
      - name: checkdoc
        run: make lint
